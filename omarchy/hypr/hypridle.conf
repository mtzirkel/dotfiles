# Only drives the Binary Ring screensaver. Locking stays with Omarchy's
# idle service (idle.lock in ~/.config/omarchy/shell.json).
general {
    ignore_dbus_inhibit = false
}

listener {
    timeout = 150
    on-timeout = ~/.local/bin/binaryring-screensaver start
    on-resume = ~/.local/bin/binaryring-screensaver stop
}

# Opening the screensaver window counts as activity, so the listener above
# resumes immediately (the script ignores that). After that, hypridle thinks
# you're active and wouldn't report your next keypress; this 1s listener does.
listener {
    timeout = 1
    # hypridle skips on-resume when a listener has no on-timeout, so give it a no-op
    on-timeout = true
    on-resume = ~/.local/bin/binaryring-screensaver stop
}

# Omarchy locks at 300s; stop drawing so it doesn't run under the lock
listener {
    timeout = 300
    on-timeout = ~/.local/bin/binaryring-screensaver stop force
}
