# ~/.tmux.conf — optimized for remote Claude Code via Moshi on iPhone

# Easier prefix for phone keyboards (Ctrl-a instead of Ctrl-b)
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Mouse support (useful for scrolling on phone)
set -g mouse on

# Larger scrollback buffer
set -g history-limit 50000

# Start windows/panes at 1 (easier to reach on phone keyboard)
set -g base-index 1
setw -g pane-base-index 1

# Status bar shows session name
set -g status-left '[#S] '
set -g status-right '%H:%M'

# Quick reload
bind r source-file ~/.tmux.conf \; display "Reloaded"

# Mouse selection copies to the clipboard of the machine you are SITTING AT.
# pbcopy here would copy to headwaters own clipboard, which is useless over
# SSH. set-clipboard on makes tmux emit OSC 52 instead, which travels back
# down the SSH connection and Ghostty writes to the local Mac clipboard.
set -g set-clipboard on
set -ga terminal-features ",xterm-256color:clipboard"
bind -T copy-mode      MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi   MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
# y also copies the current selection in copy mode
bind -T copy-mode      y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi   y send-keys -X copy-selection-and-cancel

# --- Session persistence across reboots -------------------------------
# resurrect saves/restores layout + cwd; continuum snapshots every 15 min
# and auto-restores the moment the tmux server next starts (i.e. on `hw`).
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Boot handled by ~/Library/LaunchAgents/local.tmux-main.plist instead of
# continuum's own osx boot script, which opens Terminal.app on the desktop.
set -g @continuum-boot 'off'

# Keep this as the LAST line of the file — tpm must load after all settings.
run '~/.tmux/plugins/tpm/tpm'
