# ~/.tmux.conf — optimized for remote Claude Code via Moshi on iPhone

# Easier prefix for phone keyboards (Ctrl-a instead of Ctrl-b)
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Mouse support (useful for scrolling on phone)
set -g mouse on

# Larger scrollback buffer
set -g history-limit 50000

# Start windows/panes at 1 (easier to reach on phone keyboard)
set -g base-index 1
setw -g pane-base-index 1

# Status bar shows session name
set -g status-left '[#S] '
set -g status-right '%H:%M'

# Quick reload
bind r source-file ~/.tmux.conf \; display "Reloaded"

# Mouse selection copies straight to the macOS clipboard (drag = copy).
# Without this, `mouse on` swallows drags into tmux's own buffer and
# Cmd+C has nothing selected. Shift+drag still bypasses tmux entirely.
bind -T copy-mode      MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi   MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
# prefix+y also copies the current selection in copy mode
bind -T copy-mode      y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi   y send-keys -X copy-pipe-and-cancel "pbcopy"

# --- Session persistence across reboots -------------------------------
# resurrect saves/restores layout + cwd; continuum snapshots every 15 min
# and auto-restores the moment the tmux server next starts (i.e. on `hw`).
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Keep this as the LAST line of the file — tpm must load after all settings.
run '~/.tmux/plugins/tpm/tpm'
